global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.07
      footprint_padding: 0.001
      resolution: 0.025
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.07
          obstacle_max_range: 12.0
          obstacle_min_range: 0.07
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.35
      always_send_full_costmap: true
      introspection_mode: "disabled"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 1
      height: 1
      resolution: 0.025
      robot_radius: 0.07
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.07
          obstacle_max_range: 12.0
          obstacle_min_range: 0.07
      always_send_full_costmap: true
      introspection_mode: "disabled"

planner_server:
  ros__parameters:
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_smac_planner::SmacPlanner2D'
      tolerance: 0.1

controller_server:
  ros__parameters:
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: "odometry/filtered"
    enable_stamped_cmd_vel: false

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.19
      min_linear_vel: -0.19
      max_linear_accel: 12.0
      max_linear_decel: -12.0
      max_angular_vel: 4.9
      min_angular_vel: -4.9
      max_angular_accel: 30.0
      max_angular_decel: -30.0
      lookahead_dist: 0.3
      approach_velocity_scaling_dist: 0.2
      cost_scaling_dist: 0.35
      regulated_linear_scaling_min_radius: 0.15
      regulated_linear_scaling_min_speed: 0.11
      use_dynamic_window: true

velocity_smoother:
  ros__parameters:
    feedback: "CLOSED_LOOP"
    max_velocity: [0.19, 0.0, 4.9]
    min_velocity: [-0.19, 0.0, -4.9]
    max_accel: [12.0, 0.0, 30.0]
    max_decel: [-12.0, 0.0, -30.0]
    odom_topic: "odometry/filtered"
    enable_stamped_cmd_vel: false

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
      simulate_ahead_time: 1.0
      max_rotational_vel: 4.9
      min_rotational_vel: 0.4
      rotational_acc_lim: 30.0
      enable_stamped_cmd_vel: false
    backup:
      plugin: "nav2_behaviors::BackUp"
      simulate_ahead_time: 4.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 12.0
      deceleration_limit: -12.0
      minimum_speed: 0.01
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
      simulate_ahead_time: 4.0
      enable_stamped_cmd_vel: false
      acceleration_limit: 12.0
      deceleration_limit: -12.0
      minimum_speed: 0.01
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    odom_topic: "odometry/filtered"